[mmu2s]
connection_method: Serial # Native or Serial
serial: /dev/ttyUSB0
baud: 115200
timeout: 1.0
load_total_distance: 250 # Used as a timeout for filament to load between the FINDA and Filament Extruder Sensor
load_step: 0.1 # Used as a granularity amount for gcode commands send to extruder motor while waiting for filament to arrive
load_extra_pull: 0 # Extra amount to pull filament in after filament detected from a load
load_extra_retract: 0 # Amount to retract filament after extra pull
load_slow_feedrate: 13.5 # Feedrate of the extruder motor to pull filament in. 0 reads MMU register to match it. In mm/s
load_feedrate_factor: 1.0 # Multiplier for during MMU to extruder handoff
load_grab_forward_distance: 50.0 # Distance to pull the filament in for the grab test
load_grab_reverse_distance: -50.0 # Distance to retract the filament out for the grab test
load_grab_speed: 30.0 # Speed at which the filament is loaded and unloaded for grab test
unload_retract_speed: 20 # Initial extruder retraction speed on an unload from extruder
unload_step: 2 # Used as a granularity amount for gcode commands send to extruder motor while waiting for filament sensor to deactivate
unload_max_retract: 100 # Used as a timeout for filament to unload from extruder
FINDA_poll_rate: 10 # Polling rate of FINDA probe (sec)
mmu_extra_load_distance: 0 # Allows for writing MMU register to change the extra_load_distance. -1 means default
mmu_slow_feedrate: 0 # Allows for writing MMU register to change slow_feedrate. 0 means use default
mmu_load_feedrate: 0 # Allows for writing MMU register to change load_feedrate. 0 means use default
mmu_pulley_current: -1 # Allows for writing MMU register to change pulley_current. -1 means use default
mmu_selector_current: -1 # Allows for writing MMU register to change selector_current. -1 means use default
mmu_idler_current: -1 # Allows for writing MMU register to change idler_current. -1 means use default
mmu_bowden_length: 0 # Allows for writing MMU register to change bowden_length. 0 means use default
mmu_cut_length: 0 # Allows for writing MMU register to change cut_length. 0 means use default
mmu_restart: False # Toggles MMU restarting when Klipper initializes
mmu_cutter: True # Toggles use of MMU cutter for loading retries

[gcode_macro _SYNC_EXTRUDER_PANEL]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current_slot = svv.mmu_loaded_slot | default(5) | int %}
    
    SET_GCODE_VARIABLE MACRO=T0 VARIABLE=active VALUE={1 if current_slot == 0 else 0}
    SET_GCODE_VARIABLE MACRO=T1 VARIABLE=active VALUE={1 if current_slot == 1 else 0}
    SET_GCODE_VARIABLE MACRO=T2 VARIABLE=active VALUE={1 if current_slot == 2 else 0}
    SET_GCODE_VARIABLE MACRO=T3 VARIABLE=active VALUE={1 if current_slot == 3 else 0}
    SET_GCODE_VARIABLE MACRO=T4 VARIABLE=active VALUE={1 if current_slot == 4 else 0}


[delayed_gcode INIT_EXTRUDER_PANEL_SYNC]
initial_duration: 1.5
gcode:
    _SYNC_EXTRUDER_PANEL

[gcode_macro MMU_TIP_SHAPE]
gcode:
    G1 E-15.0000 F6000
    G1 E-24.5000 F5400
    G1 E-7.0000 F2700
    G1 E-3.5000 F1620
    G4 P0
    G1 E20.0000 F1044
    G1 E-20.0000 F1183
    G1 E20.0000 F1322
    G1 E-20.0000 F1462
    G1 E20.0000 F1601
    G1 E-20.0000 F1740
    G1 E-35.0000 F2000
    G4 P0
    G1 E-2.0000 F1800
    G4 P500
    G1 E-2 F3000

[gcode_macro MMU_UNLOAD_SEQUENCE]
gcode:
  SAVE_GCODE_STATE NAME=unload_state
  G91
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
    M117 Heating...
    M109 S{params.TEMP|default(220, true)}
  {% endif %}
  G92 E0.0
  G91
  G1 E-45 F5000
  G1 E-15 F1000
  G1 E-20 F1000
  G90
  G92 E0.0
  M400
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro MMU_SPOOLJOIN_SEQUENCE]
gcode:
	{% set svv = printer.save_variables.variables %}
    {% set next_spool = svv.mmu_spooljoin_next_spool | default(5) | int %}
	SAVE_GCODE_STATE NAME=MMU_SPOOL_JOIN
	PAUSE_BASE
  	{% set x_park = printer.toolhead.axis_maximum.x|float - 4.0 %}
  	{% set y_park = printer.toolhead.axis_maximum.y|float - 4.0 %}
  	{% set z_park_delta = 10.0 %}
  	{% set max_z = printer.toolhead.axis_maximum.z|float %}
  	{% set act_z = printer.toolhead.position.z|float %}
  	{% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  	{% else %}
    	{% set z_safe = max_z - act_z %}
  	{% endif %}
  	{% if printer.extruder.can_extrude|lower == 'true' %}
    	M83
    	G1 E-1 F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  	{% endif %}
  	{% if "xyz" in printer.toolhead.homed_axes %}
    	G91
    	G1 Z{z_safe} F900
    	G90
    	G1 X{x_park} Y{y_park} F6000
    	{% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  	{% endif %}
    G1 E20 F300
    SAVE_VARIABLE VARIABLE=mmu_loaded_slot VALUE=5
    M400
    MMU_LOAD SLOT={next_spool}
    M400
    G1 E150 F350
    G1 E-1 F300
    M400
    RESTORE_GCODE_STATE NAME=MMU_SPOOL_JOIN
    RESUME
    

[gcode_macro T0]
description: MMU Tool 0
variable_active: 0
gcode:
    {% if printer.virtual_sdcard.is_active == True %}
        SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=0
        MMU_LOAD SLOT=0
        _SYNC_EXTRUDER_PANEL
    {% else %}
        M118 MMU Dashboard Lock: Manual tool changes are disabled!
    {% endif %}

