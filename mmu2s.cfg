[gcode_macro DECODE_FILAMENT_MAP]
description: Unpacks the OrcaSlicer filament map and saves the initial print tool.
variable_filament_array: []
# Add a persistent variable to store the first tool used in the print job
variable_initial_tool: 0
gcode:
    {% set raw_filaments = params.FILAMENTS|default("")|string %}
    {% set raw_temps = params.TEMPS|default("")|string %}
    {% set raw_names = params.NAMES|default("")|string %}
    # 1. Capture the initial tool slot number
    {% set initial_tool_idx = params.INITIAL_TOOL|default(0)|int %}

    {% if raw_filaments == "" or raw_temps == "" or raw_names == "" %}
        M118 ERROR: Missing FILAMENTS, TEMPS, or NAMES variables.
    {% else %}
        # 2. Save the initial tool index directly into global memory
        SET_GCODE_VARIABLE MACRO=DECODE_FILAMENT_MAP VARIABLE=initial_tool VALUE={initial_tool_idx}

        # [ ... keep your existing array sorting & text string logic here ... ]
        {% set filament_list = raw_filaments.split(',') %}
        {% set temp_list = raw_temps.split(',') %}
        {% set name_list = raw_names.split(',') %}
        {% set temp_array = [] %}
        {% set ns = namespace(msg="[FILAMENT MAP] ") %}

        {% for mat_type in filament_list %}
            {% set slot_index = loop.index0 %}
            {% set layer_temp = temp_list[slot_index]|default(200)|int %}
            {% set profile_name = name_list[slot_index]|default("Unknown Profile")|string %}

            {% if mat_type|upper == 'EMPTY' or layer_temp == 0 or 'EMPTY' in profile_name|upper %}
                {% set slot_dict = {'slot': slot_index, 'active': False, 'material': 'EMPTY', 'temp': 0, 'profile': 'None'} %}
                {% set ns.msg = ns.msg + "Slot " + slot_index|string + ": EMPTY" %}
            {% else %}
                {% set slot_dict = {'slot': slot_index, 'active': True, 'material': mat_type, 'temp': layer_temp, 'profile': profile_name} %}
                {% set ns.msg = ns.msg + "Slot " + slot_index|string + ": " + mat_type + " (" + layer_temp|string + "°C) " + profile_name %}
            {% endif %}
            {% set _ = temp_array.append(slot_dict) %}
            {% if not loop.last %} {% set ns.msg = ns.msg + "  ||  " %} {% endif %}
        {% endfor %}

        SET_GCODE_VARIABLE MACRO=DECODE_FILAMENT_MAP VARIABLE=filament_array VALUE="{temp_array|replace('"', '\"')}"
        
        # Append initial tool information to your terminal confirmation
        M118 { ns.msg } (Initial Print Tool: Slot {initial_tool_idx})
    {% endif %}

[gcode_macro SMART_MMU_UNLOAD]
description: Unloads the current tool automatically using the material and temp from the OrcaSlicer map, but only if the target tool is different.
gcode:
    SAVE_GCODE_STATE NAME=SMART_MMU_UNLOAD
    
    # 1. Grab the current loaded slot from your saved variables macro
    {% set current_tool_idx = printer.save_variables.variables.mmu_loaded_slot|default(5)|int %}
    
    # 2. Get the incoming target tool passed from the slicer or tool change macro
    {% set target_tool_idx = printer["gcode_macro DECODE_FILAMENT_MAP"].initial_tool|default(-1)|int %}
    
    # 3. Pull in your saved filament array and tip-shaping choice
    {% set map = printer["gcode_macro DECODE_FILAMENT_MAP"].filament_array %}
    {% set tip_shape = params.TIP_SHAPE|default(1)|int %}

    # 4. Check if we actually need to unload
    {% if target_tool_idx != -1 and current_tool_idx == target_tool_idx or current_tool_idx == 5 %}
        M118 MMU: Slot {current_tool_idx} is already loaded or nothing is loaded. Skipping unload.
    {% else %}
		# ==================== NEW SAFETY POSITIONING SEQUENCE ====================
        M118 MMU: Preparing toolhead positioning for unload...
        
        # Ensure the printer is homed before attempting absolute movements
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}

        # Relative positioning to safely hop up and clear any printed parts/purges
        G91 
        G1 Z5 F2000          # Lift Z up 5mm relative to current position
        
        # Absolute positioning to move to your unload destination
        G90
        G1 X0 Z10 F3000      # Travel to X=0 and Z=10
        # =========================================================================
        # 5. Process the data look-up and perform unload if tools don't match
        {% if map|length > 0 and current_tool_idx < map|length %}
            {% set slot = map[current_tool_idx] %}

            {% if not slot.active %}
                { action_respond_info("SMART_MMU_UNLOAD: Slot %d is marked EMPTY. Aborting." % current_tool_idx) }
            {% else %}
                M118 MMU: Dynamic Unload for Slot {current_tool_idx} ({slot.material}) -> Heating to {slot.temp}°C...
                M109 S{slot.temp}

                # 6. Perform the tool-specific unload
                {% if tip_shape == 1 %}
                    G1 E20 F100  # Extrude a small blob first to form a clean tip profile
                    MMU_UNLOAD TIP_SHAPE=1
                {% else %}
                    MMU_UNLOAD
                {% endif %}
            {% endif %}
        {% else %}
            # Fallback safety if the print was started without passing the OrcaSlicer map
            M118 [MMU] Warning: No OrcaSlicer map found for Slot {current_tool_idx}. Using 215°C safe fallback.
            M109 S215
            MMU_UNLOAD
        {% endif %}
    {% endif %}
    
    RESTORE_GCODE_STATE NAME=SMART_MMU_UNLOAD